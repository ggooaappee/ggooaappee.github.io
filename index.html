<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#00c3ac">
    <title>乐云一卡通</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell" id="app">
      <main class="app-content">
        <section class="page active" id="homePage" aria-label="首页">
          <div class="home-page">
            <section class="profile-card" aria-label="校园卡资料">
              <div class="card-surface">
                <img class="school-logo" src="assets/logo.png" alt="仰恩大学">

                <div class="identity-line">
                  <button class="student-name" id="nameButton" type="button" aria-label="修改姓名和学号">张三</button>
                  <span class="student-number" id="studentNumber">2025010101</span>
                  <button class="account-toggle" id="accountToggle" type="button" aria-label="切换用户">
                    <svg class="chevron" viewBox="0 0 20 20" aria-hidden="true">
                      <path d="M5.25 7.5 10 12.25 14.75 7.5"></path>
                    </svg>
                  </button>
                </div>

                <button class="avatar-button" id="avatarButton" type="button" aria-label="更换头像" title="点击更换头像">
                  <img id="avatarImage" src="assets/avatar.svg" alt="头像">
                  <span class="avatar-edit" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                      <path d="M4 8.5h3l1.2-2h7.6l1.2 2H20a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2Z"></path>
                      <circle cx="12" cy="14" r="3.2"></circle>
                    </svg>
                  </span>
                </button>

                <button class="school-line" id="schoolButton" type="button" aria-label="修改学院、专业和班级">
                  <span id="schoolText">示例学院/示例专业/示例班级</span>
                </button>

                <button class="balance-line" id="balanceButton" type="button" aria-label="修改充值余额和补助余额">
                  <span>充值余额:<strong id="rechargeBalance">100.00</strong> ，补助余额:<strong id="subsidyBalance">0.00</strong></span>
                </button>
              </div>
            </section>

            <button class="notice-bar" id="noticeButton" type="button" aria-label="查看消息通知">
              <svg class="notice-icon" viewBox="0 0 28 28" aria-hidden="true">
                <path d="M5 12h4l6-5v14l-6-5H5z"></path>
                <path d="M19 10.2c1.5 1.5 1.5 6.1 0 7.6M22.2 7c3.2 3.2 3.2 10.8 0 14"></path>
              </svg>
              <span class="notice-track">
                <span id="noticeText">关于办理“大学生信用卡”的介绍</span>
              </span>
            </button>

            <nav class="feature-grid" aria-label="功能菜单">
              <button class="feature-item" type="button" data-feature="教育优惠商城">
                <svg class="feature-icon" aria-hidden="true"><use href="assets/icons.svg#icon-mobile134"></use></svg>
                <span>教育优惠商城</span>
              </button>
              <button class="feature-item" type="button" data-feature="扫一扫">
                <svg class="feature-icon" aria-hidden="true"><use href="assets/icons.svg#icon-mobile001"></use></svg>
                <span>扫一扫</span>
              </button>
              <button class="feature-item" type="button" data-feature="付款码">
                <svg class="feature-icon" aria-hidden="true"><use href="assets/icons.svg#icon-mobile002"></use></svg>
                <span>付款码</span>
              </button>
              <button class="feature-item" type="button" data-feature="刷脸设置">
                <svg class="feature-icon" aria-hidden="true"><use href="assets/icons.svg#icon-mobile003"></use></svg>
                <span>刷脸设置</span>
              </button>
              <button class="feature-item" type="button" data-feature="交易明细">
                <svg class="feature-icon" aria-hidden="true"><use href="assets/icons.svg#icon-mobile010"></use></svg>
                <span>交易明细</span>
              </button>
              <button class="feature-item" type="button" data-feature="账单缴费查询">
                <svg class="feature-icon" aria-hidden="true"><use href="assets/icons.svg#icon-mobile034"></use></svg>
                <span>账单缴费查询</span>
              </button>
              <button class="feature-item" type="button" data-feature="智能水电缴费">
                <svg class="feature-icon" aria-hidden="true"><use href="assets/icons.svg#icon-mobile034"></use></svg>
                <span>智能水电缴费</span>
              </button>
              <button class="feature-item" type="button" data-feature="OA申请">
                <svg class="feature-icon" aria-hidden="true"><use href="assets/icons.svg#icon-mobile057"></use></svg>
                <span>OA申请</span>
              </button>
              <button class="feature-item" type="button" data-feature="固定座位时长">
                <svg class="feature-icon" aria-hidden="true"><use href="assets/icons.svg#icon-mobile055"></use></svg>
                <span>固定座位时长</span>
              </button>
              <button class="feature-item" type="button" data-feature="综测成绩">
                <svg class="feature-icon" aria-hidden="true"><use href="assets/icons.svg#icon-mobile081"></use></svg>
                <span>综测成绩</span>
              </button>
              <button class="feature-item" type="button" data-feature="校车查询">
                <svg class="feature-icon" aria-hidden="true"><use href="assets/icons.svg#icon-mobile043"></use></svg>
                <span>校车查询</span>
              </button>
              <button class="feature-item" type="button" data-feature="成绩查询">
                <svg class="feature-icon" aria-hidden="true"><use href="assets/icons.svg#icon-mobile087"></use></svg>
                <span>成绩查询</span>
              </button>
              <button class="feature-item" type="button" data-feature="帮助">
                <svg class="feature-icon" aria-hidden="true"><use href="assets/icons.svg#icon-mobile032"></use></svg>
                <span>帮助</span>
              </button>
              <button class="feature-item" type="button" data-feature="校园商圈">
                <svg class="feature-icon" aria-hidden="true"><use href="assets/icons.svg#icon-mobile070"></use></svg>
                <span>校园商圈</span>
              </button>
              <button class="feature-item feature-item-wide" type="button" data-feature="金融消费者权益保护">
                <svg class="feature-icon" aria-hidden="true"><use href="assets/icons.svg#icon-mobile073"></use></svg>
                <span>3·15金融消费者权益保护 ——致大学生的风险提示函</span>
              </button>
            </nav>

            <div class="banner-wrap">
              <img src="assets/banner.jpg" alt="农情开学季活动">
            </div>
          </div>
        </section>

        <section class="page" id="messagesPage" aria-label="消息">
          <div class="message-page">
            <div class="message-tabs" role="tablist" aria-label="消息状态">
              <button class="message-tab active" type="button" role="tab" aria-selected="true" data-message-filter="all">全部</button>
              <button class="message-tab" type="button" role="tab" aria-selected="false" data-message-filter="unread">未读</button>
              <button class="message-tab" type="button" role="tab" aria-selected="false" data-message-filter="read">已读</button>
            </div>

            <button class="message-filter" id="messageTypeButton" type="button">
              <span class="message-filter-label">消息类型</span>
              <span class="message-filter-value" id="messageTypeValue">全部</span>
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path d="m5 7.5 5 5 5-5"></path>
              </svg>
            </button>

            <div class="message-list" id="messageList">
              <article class="message-item unread" id="creditCardMessage" data-message-status="unread">
                <div class="message-title-row">
                  <div class="message-heading">
                    <h2 id="messageTitle">关于办理“大学生信用卡”的介绍</h2>
                    <span class="message-type">公告</span>
                  </div>
                  <div class="message-read-state">
                    <span class="message-dot" aria-hidden="true"></span>
                    <span id="messageReadLabel">未读</span>
                  </div>
                </div>
                <div class="message-date">2023-03-20</div>
              </article>
            </div>

            <div class="message-empty" id="messageEmpty" hidden>
              <span class="empty-icon iconfont" aria-hidden="true"></span>
              <p>暂无消息</p>
            </div>
          </div>
        </section>

        <section class="page" id="profilePage" aria-label="我的">
          <div class="my-page">
            <div class="my-header">
              <button class="my-avatar-button" id="profileAvatarButton" type="button" aria-label="更换头像">
                <img id="profileAvatar" src="assets/avatar.svg" alt="头像">
              </button>
              <button class="my-identity" id="profileIdentityButton" type="button" aria-label="修改个人信息">
                <span class="my-name-row">
                  <strong id="profileName">张三</strong>
                  <span id="profileNumber">2025010101</span>
                </span>
                <span class="my-school-name">仰恩大学</span>
              </button>
            </div>

            <div class="my-groups">
              <section class="my-group">
                <button type="button" class="my-row" id="editProfileButton">
                  <span>个人信息</span>
                  <img src="assets/right.png" alt="">
                </button>
                <button type="button" class="my-row" data-my-demo="常用地址">
                  <span>常用地址</span>
                  <img src="assets/right.png" alt="">
                </button>
              </section>

              <section class="my-group">
                <button type="button" class="my-row" data-my-demo="修改支付密码">
                  <span>修改支付密码</span>
                  <img src="assets/right.png" alt="">
                </button>
                <button type="button" class="my-row" data-my-demo="忘记支付密码">
                  <span>忘记支付密码</span>
                  <img src="assets/right.png" alt="">
                </button>
                <button type="button" class="my-row" data-my-demo="卡片挂失">
                  <span>卡片挂失</span>
                  <img src="assets/right.png" alt="">
                </button>
              </section>

              <section class="my-group">
                <button type="button" class="my-row" data-my-demo="帮助中心">
                  <span>帮助中心</span>
                  <img src="assets/right.png" alt="">
                </button>
              </section>

              <section class="my-group">
                <button type="button" class="my-row" data-my-demo="切换账号">
                  <span>切换账号</span>
                  <img src="assets/right.png" alt="">
                </button>
                <button type="button" class="my-row" data-my-demo="解绑当前账号">
                  <span>解绑当前账号</span>
                  <img src="assets/right.png" alt="">
                </button>
              </section>

              <section class="my-group">
                <button type="button" class="my-row" data-my-demo="切换主题">
                  <span>切换主题</span>
                  <img src="assets/right.png" alt="">
                </button>
                <div class="my-row my-version">
                  <span>版本信息</span>
                  <span>2.8.9</span>
                </div>
              </section>
            </div>
          </div>
        </section>

        <section class="page feature-page" id="featurePage" aria-label="功能详情">
          <button class="detail-back" id="detailBack" type="button" aria-label="返回首页"></button>
          <div id="featureContent"></div>
        </section>
      </main>

      <footer class="bottom-nav" aria-label="底部导航">
        <button class="nav-item active" type="button" data-page="homePage">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.5 10.8 12 3.5l8.5 7.3V20a1 1 0 0 1-1 1h-5.1v-6.7H9.6V21H4.5a1 1 0 0 1-1-1z"></path>
          </svg>
          <span>首页</span>
        </button>
        <button class="nav-item" type="button" data-page="messagesPage">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4.2" y="4.2" width="15.6" height="17" rx="1.8"></rect>
            <path d="M9 4.2V3h6v1.2M8 9h8M8 12.2h8M8 15.4h5.8"></path>
          </svg>
          <span>消息</span>
        </button>
        <button class="nav-item" type="button" data-page="profilePage">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="7.5" r="3.6"></circle>
            <path d="M4.4 21c.6-5 3.2-8 7.6-8s7 3 7.6 8"></path>
          </svg>
          <span>我的</span>
        </button>
      </footer>

      <div class="account-overlay" id="accountOverlay" hidden>
        <section class="account-card" aria-label="用户信息">
          <div class="account-row account-name-row">
            <span class="account-label">姓名</span>
            <strong id="accountPanelName">张三</strong>
          </div>
          <div class="account-fields">
            <div class="account-row">
              <span class="account-label">企业名称</span>
              <span id="accountPanelSchool">仰恩大学</span>
            </div>
            <div class="account-row">
              <span class="account-label">学工号码</span>
              <span id="accountPanelNumber">2025010101</span>
            </div>
            <div class="account-row account-department-row">
              <span class="account-label">所属部门</span>
              <span id="accountPanelDepartment">示例学院/示例专业/示例班级</span>
            </div>
          </div>
        </section>
        <div class="account-actions">
          <button class="account-return" id="accountReturn" type="button">返回</button>
          <button class="account-add" id="accountAdd" type="button">添加新用户</button>
        </div>
      </div>
    </div>

    <input id="avatarInput" type="file" accept="image/*" hidden>

    <div class="sheet-backdrop" id="sheetBackdrop" hidden>
      <div class="sheet-frame">
        <section class="edit-sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
          <div class="sheet-handle" aria-hidden="true"></div>
          <div class="sheet-heading">
            <h2 id="sheetTitle">修改信息</h2>
            <button class="sheet-close" id="sheetClose" type="button" aria-label="关闭">×</button>
          </div>
          <form id="editForm">
            <div class="form-fields" id="formFields"></div>
            <button class="save-button" type="submit">保存</button>
          </form>
        </section>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="assets/qrcode.js"></script>
    <script src="app.js"></script>
  </body>
</html>
