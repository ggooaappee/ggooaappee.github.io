<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<link rel="icon" href="data:," />
<title>乐云一卡通</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #e8e8e8;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    color: #333;
  }
  button, input { font-family: inherit; }
  button, [role="button"] { min-height: 2rem; }

  .phone {
    max-width: 430px;
    margin: 0 auto;
    background: #f4f5f6;
    min-height: 100vh;
    position: relative;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 24px rgba(0,0,0,.12);
    overflow-x: clip;
    container-type: inline-size;
  }
  .pages { flex: 1 0 auto; display: flex; flex-direction: column; }
  .pages > .page { flex: 1 0 auto; }
  .page[hidden] { display: none; }

  /* ---------- 首页：绿色卡片 ---------- */
  .card-wrap { background: #f4f5f6; padding: 10px 10px 0; }
  .card {
    position: relative;
    border-radius: 14px;
    background: linear-gradient(135deg, #1ed0ab 0%, #14c39c 45%, #09b189 100%);
    padding: 14px 16px 20px;
    overflow: hidden;
    color: #fff;
    min-height: 212px;
  }
  .card::before {
    content: ""; position: absolute; right: -70px; top: -78px;
    width: 190px; height: 190px; border-radius: 50%;
    background: rgba(255,255,255,.16);
  }
  .card::after {
    content: ""; position: absolute; left: -46px; bottom: -64px;
    width: 140px; height: 140px; border-radius: 50%;
    background: rgba(255,255,255,.12);
  }
  .card > * { position: relative; z-index: 1; }

  .univ { display: flex; align-items: center; margin-left: 8px; }
  .univ-logo { height: 44px; width: auto; display: block; }

  .avatar-btn {
    position: absolute; right: 16px; top: 84px; z-index: 2;
    width: 86px; height: 86px; width: 20cqw; height: 20cqw;
    border-radius: 50%;
    border: 0; padding: 0; cursor: pointer; background: #0a9c7c;
    overflow: hidden; flex: none;
  }
  .avatar-btn img { width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1.07); }

  .id-row {
    display: flex; align-items: center; gap: 3.2cqw;
    margin-top: 24px;
    font-size: 24px; font-size: 5.5cqw;
    font-weight: 600; line-height: 1.3; white-space: nowrap;
  }
  .id-row .stu-no { font-weight: 500; letter-spacing: .2px; }
  .id-row .chev { font-size: 20px; font-size: 4.6cqw; font-weight: 300; transform: translateY(2px); }
  .dept-row {
    margin-top: 10px; line-height: 1.35; white-space: nowrap;
    font-size: 17px; font-size: 3.85cqw; letter-spacing: -.2px;
  }
  .bal-row {
    margin-top: 10px; line-height: 1.35; white-space: nowrap;
    font-size: 18px; font-size: 4.15cqw;
  }
  .editable { cursor: pointer; border-radius: 4px; }
  .editable:active { background: rgba(255,255,255,.22); }
  .bal-num { cursor: pointer; border-radius: 4px; padding: 0 1px; }
  .bal-num:active { background: rgba(255,255,255,.22); }

  /* ---------- 首页：公告条 ---------- */
  .notice {
    margin-top: 14px; background: #fff;
    padding: 9px 14px;
    display: flex; align-items: center; gap: 3px;
    color: #f6a21e; font-size: 18px; white-space: nowrap; overflow: hidden;
  }
  .notice svg { flex: none; }

  /* ---------- 首页：功能九宫格 ---------- */
  .grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    padding: 20px 2px 4px;
    row-gap: 24px;
  }
  .cell {
    display: flex; flex-direction: column; align-items: center; gap: 9px;
    background: none; border: 0; cursor: pointer; padding: 0 1px; color: #333;
  }
  .cell .ic { width: 54px; height: 54px; display: flex; align-items: center; justify-content: center; }
  .cell .lb { font-size: 16.5px; line-height: 1.25; text-align: center; white-space: nowrap; }

  /* ---------- 首页：广告横幅 ---------- */
  .banner { margin: 14px 16px 0; border-radius: 16px; overflow: hidden; line-height: 0; }
  .banner img { width: 100%; display: block; }
  .dots { display: flex; justify-content: center; padding: 9px 0 6px; }
  .dots span { width: 15px; height: 5px; border-radius: 3px; background: #b9b9b9; display: block; }

  /* ---------- 消息页 ---------- */
  .msg-tabs {
    background: #fff; display: flex; height: 54px;
  }
  .msg-tab {
    flex: 1; position: relative; background: none; border: 0; cursor: pointer;
    font-size: 20px; color: #888;
    display: flex; align-items: center; justify-content: center;
  }
  .msg-tab.on { color: #222; font-weight: 600; }
  .msg-tab.on::after {
    content: ""; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 38px; height: 3.5px; border-radius: 2px; background: #f6a21e;
  }
  .msg-filter {
    margin: 16px 12px 0; background: #fff; border-radius: 14px;
    padding: 24px 20px; display: flex; align-items: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.04);
  }
  .msg-filter .k { color: #455a64; font-size: 20px; }
  .msg-filter .v { color: #222; font-size: 20px; margin-left: 15cqw; }
  .msg-filter .chev { margin-left: auto; color: #aaa; font-size: 22px; font-weight: 300; }
  .msg-card {
    margin: 18px 12px 0; background: #fff; border-radius: 14px;
    padding: 20px 12px 22px 16px; position: relative; overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.04);
  }
  .msg-card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px;
    background: #f04438;
  }
  .msg-title-row { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
  .msg-title { color: #37474f; font-size: 17.5px; font-size: 4.1cqw; font-weight: 700; white-space: nowrap; }
  .msg-tag {
    background: #fdf0d5; color: #666; font-size: 14px; font-size: 3.3cqw; padding: 3px 8px;
    transform: skewX(-14deg); white-space: nowrap;
  }
  .msg-tag span { display: inline-block; transform: skewX(14deg); }
  .msg-unread { display: flex; align-items: center; gap: 5px; color: #e53935; font-size: 15.5px; font-size: 3.6cqw; white-space: nowrap; }
  .msg-unread i { width: 9px; height: 9px; border-radius: 50%; background: #f04438; display: block; }
  .msg-date { color: #9a9a9a; font-size: 16px; margin-top: 13px; }
  .msg-empty { text-align: center; color: #aaa; font-size: 15px; padding: 44px 0 10px; }

  /* ---------- 我的页 ---------- */
  .mine-head {
    background: #fff; display: flex; align-items: center; gap: 18px;
    padding: 20px 18px 22px;
  }
  .mine-avatar-btn {
    width: 88px; height: 88px; width: 20.5cqw; height: 20.5cqw;
    border-radius: 50%; border: 0; padding: 0; cursor: pointer;
    overflow: hidden; flex: none; background: #ddd;
  }
  .mine-avatar-btn img { width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1.07); }
  .mine-id {
    display: flex; align-items: baseline; gap: 3.5cqw; white-space: nowrap;
    color: #555; font-size: 25px; font-size: 5.9cqw;
  }
  .mine-id .editable:active { background: rgba(0,0,0,.07); }
  .mine-univ { color: #777; font-size: 17px; margin-top: 9px; }
  .mgroup { margin-top: 12px; background: #fff; }
  .mrow {
    width: 100%; height: 64px; padding: 0 18px;
    display: flex; align-items: center; justify-content: space-between;
    background: #fff; border: 0; border-bottom: 1px solid #efefef;
    font-size: 19px; color: #333; cursor: pointer; text-align: left;
  }
  .mgroup .mrow:last-child { border-bottom: 0; }
  .mrow .arr { color: #c9c9c9; font-size: 30px; font-weight: 200; line-height: 1; }
  .mrow .ver { color: #777; font-size: 19px; }

  /* ---------- 底部导航 ---------- */
  .tabbar {
    position: sticky; bottom: 0;
    width: 100%; height: calc(64px + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    background: #fff; border-top: 1px solid #e3e3e3;
    display: flex; z-index: 40; flex: none;
  }
  .tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    background: none; border: 0; cursor: pointer; color: #3d3d3d; font-size: 14px; padding-top: 6px;
  }
  .tab.active { color: #0bb491; }
  .tab svg { stroke: currentColor; }

  /* ---------- 编辑弹层 ---------- */
  .mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: none; align-items: flex-end; justify-content: center; z-index: 100;
  }
  .mask.open { display: flex; }
  .sheet {
    width: 100%; max-width: 430px; background: #fff;
    border-radius: 16px 16px 0 0; padding: 20px 20px calc(18px + env(safe-area-inset-bottom));
  }
  .sheet h3 { margin: 0 0 14px; font-size: 17px; font-weight: 600; color: #222; }
  .sheet input {
    width: 100%; font-size: 17px; padding: 12px 12px;
    border: 1px solid #d9d9d9; border-radius: 8px; outline: none; background: #fafafa;
    min-height: 48px;
  }
  .sheet input:focus { border-color: #0bb491; background: #fff; }
  .sheet .btns { display: flex; gap: 12px; margin-top: 18px; }
  .sheet .btns button {
    flex: 1; height: 46px; border-radius: 8px; font-size: 16px; cursor: pointer; border: 0;
  }
  .btn-cancel { background: #f1f1f1; color: #333; }
  .btn-ok { background: #0bb491; color: #fff; font-weight: 600; }
  .toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(10px);
    background: rgba(20,20,20,.85); color: #fff; font-size: 14px;
    padding: 9px 18px; border-radius: 20px; opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s; z-index: 120; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 380px) {
    .cell .lb { font-size: 14.5px; }
    .mrow { font-size: 17.5px; }
  }
</style>
</head>

      <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke-width="1.6"><circle cx="12" cy="8" r="4.2"/><path d="M4 20.5c1-4.2 4.2-6 8-6s7 1.8 8 6"/></svg>
      <span>我的</span>
    </button>
  </footer>
</div>

<input type="file" id="avatarInput" accept="image/*" hidden />

<!-- 编辑弹层 -->
<div class="mask" id="mask">
  <div class="sheet">
    <h3 id="sheetTitle">修改</h3>
    <input id="sheetInput" type="text" autocomplete="off" aria-label="输入内容" />
    <div class="btns">
      <button class="btn-cancel" id="btnCancel">取消</button>
      <button class="btn-ok" id="btnOk">保存</button>
    </div>
  </div>
</div>
<div class="toast" id="toast">已保存</div>

<script>
(function () {
  // v2 存储键：旧版本（lykt_*）里存过的资料不再读取，并在此清除
  var KEYS = { name: 'lykt2_name', no: 'lykt2_no', dept: 'lykt2_dept', bal1: 'lykt2_bal1', bal2: 'lykt2_bal2', avatar: 'lykt2_avatar' };
  try {
    ['lykt_name', 'lykt_no', 'lykt_dept', 'lykt_bal1', 'lykt_bal2', 'lykt_avatar'].forEach(function (k) {
      localStorage.removeItem(k);
    });
  } catch (e) {}
  var LABELS = { name: '姓名', no: '学号', dept: '院系/专业/班级', bal1: '充值余额', bal2: '补助余额' };
  var MODES = { no: 'numeric', bal1: 'decimal', bal2: 'decimal' };

  function bindEls(key) { return document.querySelectorAll('[data-bind="' + key + '"]'); }
  function getVal(key) {
    var el = document.querySelector('[data-bind="' + key + '"]');
    return el ? el.textContent.trim() : '';
  }
  function setVal(key, v) {
    bindEls(key).forEach(function (el) { el.textContent = v; });
    try { localStorage.setItem(KEYS[key], v); } catch (e) {}
  }

  // 载入已保存的资料（首页与"我的"页共用同一份）
  try {
    Object.keys(KEYS).forEach(function (k) {
      if (k === 'avatar') return;
      var v = localStorage.getItem(KEYS[k]);
      if (v !== null && v !== '') bindEls(k).forEach(function (el) { el.textContent = v; });
    });
    var av = localStorage.getItem(KEYS.avatar);
    if (av) document.querySelectorAll('.js-avatar-img').forEach(function (img) { img.src = av; });
  } catch (e) {}

  var toastTimer = null;
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1500);
  }

  // 行内编辑弹层
  var mask = document.getElementById('mask');
  var input = document.getElementById('sheetInput');
  var title = document.getElementById('sheetTitle');
  var current = null;

  function openEditor(key) {
    current = key;
    title.textContent = '修改' + (LABELS[key] || '');
    input.value = getVal(key);
    input.inputMode = MODES[key] || 'text';
    mask.classList.add('open');
    setTimeout(function () { input.focus(); input.select(); }, 60);
  }
  function closeEditor() { mask.classList.remove('open'); current = null; }
  function commit() {
    if (!current) return;
    var v = input.value.trim();
    if (v !== '') {
      if (current === 'bal1' || current === 'bal2') {
        var n = parseFloat(v);
        if (!isNaN(n)) v = n.toFixed(2);
      }
      setVal(current, v);
      toast('已保存');
    }
    closeEditor();
  }
  document.getElementById('btnOk').addEventListener('click', commit);
  document.getElementById('btnCancel').addEventListener('click', closeEditor);
  mask.addEventListener('click', function (e) { if (e.target === mask) closeEditor(); });
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') commit(); });

  document.querySelectorAll('[data-bind]').forEach(function (el) {
    el.setAttribute('role', 'button');
    el.setAttribute('tabindex', '0');
    el.addEventListener('click', function () { openEditor(el.getAttribute('data-bind')); });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openEditor(el.getAttribute('data-bind')); }
    });
  });

  // 更换头像：首页与"我的"页头像共用，任一处更换两处同步
  var fileInput = document.getElementById('avatarInput');
  document.querySelectorAll('.js-avatar-btn').forEach(function (btn) {
    btn.addEventListener('click', function () { fileInput.click(); });
  });
  fileInput.addEventListener('change', function () {
    var file = fileInput.files && fileInput.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var size = 256;
        var canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        var ctx = canvas.getContext('2d');
        var side = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
        var url = canvas.toDataURL('image/jpeg', 0.85);
        document.querySelectorAll('.js-avatar-img').forEach(function (im) { im.src = url; });
        try { localStorage.setItem(KEYS.avatar, url); } catch (e) {}
        toast('头像已更换');
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
    fileInput.value = '';
  });

  // 三页切换
  var tabs = document.querySelectorAll('.tab');
  function go(page) {
    ['home', 'msg', 'mine'].forEach(function (p) {
      document.getElementById('page-' + p).hidden = (p !== page);
    });
    tabs.forEach(function (t) { t.classList.toggle('active', t.getAttribute('data-go') === page); });
    window.scrollTo(0, 0);
  }
  tabs.forEach(function (t) {
    t.addEventListener('click', function () { go(t.getAttribute('data-go')); });
  });

  // 消息页筛选：这条消息是未读，"已读"下为空
  var msgCard = document.getElementById('msgCard');
  var msgEmpty = document.getElementById('msgEmpty');
  document.querySelectorAll('.msg-tab').forEach(function (t) {
    t.addEventListener('click', function () {
      document.querySelectorAll('.msg-tab').forEach(function (x) { x.classList.remove('on'); });
      t.classList.add('on');
      var f = t.getAttribute('data-filter');
      var show = (f !== 'read');
      msgCard.style.display = show ? '' : 'none';
      msgEmpty.hidden = show;
    });
  });
})();
</script>
</body>
</html>
